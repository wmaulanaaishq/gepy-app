name: Gepy Native Android CI/CD

on:
  push:
    branches:
      - main
      - master
      - develop
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.gif'
      - 'LICENSE'
      - 'NOTICE'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
      - develop
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.gif'
      - 'LICENSE'
      - 'NOTICE'
  workflow_dispatch:
    inputs:
      include_debug_apk:
        description: "Sertakan debug.apk (~92 MB) pada artifact manual"
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  checks: write

jobs:
  fast-gate:
    name: "Fast Security & Gepy-Eval Gate"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Security Audit (Verify No Secrets Tracked in Git)
        run: |
          if git ls-files --error-unmatch local_secrets.json >/dev/null 2>&1; then
            echo "::error::local_secrets.json tidak boleh di-commit ke Git!"
            exit 1
          fi
          if git ls-files --error-unmatch local.properties >/dev/null 2>&1; then
            echo "::error::local.properties tidak boleh di-commit ke Git!"
            exit 1
          fi
          echo "Security check passed: tidak ada berkas kredensial rahasia yang terlacak di Git."

      - name: Run Gepy-Eval Dataset, Tool & Persona Regression Gate
        run: python3 ./scripts/evals/runner.py --mode quick

  quality-and-unit-tests:
    name: "Quality Gate: Unit Tests & Android Lint"
    needs: fast-gate
    if: ${{ github.event.repository.private == false || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle with Caching
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event.repository.private == true || (github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master') }}

      - name: Grant Execute Permission for gradlew
        run: chmod +x ./gradlew

      - name: Run JVM Unit Test Suite (testDebugUnitTest)
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Run Android Static Analysis (lintDebug)
        run: ./gradlew lintDebug --stacktrace

      - name: Upload Unit Test & Lint Reports (Failure Only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gepy-quality-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          retention-days: 1

  build-apk:
    name: "Build Check & Release Binaries"
    needs: quality-and-unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle with Caching
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event.repository.private == true || (github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master') }}

      - name: Grant Execute Permission for gradlew
        run: chmod +x ./gradlew

      - name: Extract App Version Metadata
        id: meta
        run: |
          VERSION=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$VERSION" ]; then
            echo "::error::Gagal membaca versionName dari app/build.gradle.kts"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify Debug APK Compilation (CI Harian Tanpa Upload Biner)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && github.event_name != 'workflow_dispatch' }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Assemble Release Binaries (Tag v* / Manual Dispatch)
        if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
        env:
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_MODEL: ${{ secrets.ELEVENLABS_MODEL }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_KEY: ${{ secrets.AZURE_OPENAI_KEY }}
        run: |
          TASKS="assembleRelease bundleRelease"
          if [ "${{ inputs.include_debug_apk }}" = "true" ]; then
            TASKS="assembleDebug $TASKS"
          fi
          ./gradlew $TASKS --stacktrace
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/gepy-v${{ steps.meta.outputs.version }}-release.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/gepy-v${{ steps.meta.outputs.version }}-release.aab"
          if [ "${{ inputs.include_debug_apk }}" = "true" ]; then
            cp app/build/outputs/apk/debug/app-debug.apk "dist/gepy-v${{ steps.meta.outputs.version }}-debug.apk"
          fi

      - name: Upload Binary Artifacts (APK & AAB)
        if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: gepy-binaries
          path: |
            dist/*.apk
            dist/*.aab
          retention-days: 1

  publish-release:
    name: "Publish GitHub Release (Tag v*)"
    needs: build-apk
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download Built Binaries
        uses: actions/download-artifact@v4
        with:
          name: gepy-binaries
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/*.apk
            release-assets/*.aab
